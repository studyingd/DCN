# DCN - Nginx Configuration
# Production-ready with security headers, SPA routing, and API/WS proxy
#
# 本文件被 COPY 成 /etc/nginx/conf.d/default.conf，因此文件顶层就是 nginx 的
# http 上下文 —— limit_req_zone / map 这类只能在 http 层出现的指令放在这里。

# ============================================================
# 边缘限流（http 上下文）
# ============================================================
# 后端 slowapi 已经按「已认证用户」维度限流（默认 100/min，敏感接口更严），
# nginx 这一层只做兜底：让洪峰在到达 Python 之前就被丢掉，拒绝成本近乎为零。
#
# 阈值刻意放宽（每 IP 50r/s、突发 100）：企业出口 NAT 会让整个办公网共用一个
# 公网 IP，收得太紧会误伤正常用户。精确的策略限流交给后端按用户维度执行。
limit_req_zone $binary_remote_addr zone=dcn_api:10m rate=50r/s;

# 登录接口单独收紧（暴力破解）。map 出空 key 时 nginx 会跳过该 zone，
# 所以只有精确命中 /api/auth/login 的请求才计入这个桶。
map $uri $dcn_login_key {
    default          "";
    /api/auth/login  $binary_remote_addr;
}
limit_req_zone $dcn_login_key zone=dcn_login:5m rate=30r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compress API responses and text assets to reduce transfer time.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ============================================================
    # Security Headers
    # ============================================================

    # Hide nginx version
    server_tokens off;

    # 文件上传走 /api（multipart 单请求，后端上限 200MB）。nginx 默认 1m 会在
    # 请求体超过 1MB 时直接 413——曾实测 2MB body 就被拦（后端本身能收）。
    # 220m 给 multipart 边界/表单字段留出余量。
    client_max_body_size 220m;

    # 安全响应头**不**放在 server 级：nginx 的 add_header 只在「当前层没有任何
    # add_header」时才继承上层，而 / 与静态资源 location 都必须设置 Cache-Control，
    # 继承会被静默丢弃（旧配置就踩了这个坑）。改为在每个由 nginx 直接产出内容的
    # location 里显式 include；/api、/ws 等反代路径由后端 SecurityHeadersMiddleware
    # 负责，避免同名响应头重复下发。
    #
    # 若本机 nginx 还处在别的 LB/CDN 之后，$binary_remote_addr 拿到的是那个 LB 的
    # IP，所有客户端会共用一个限流桶。此时启用下面三行先还原真实客户端 IP：
    # set_real_ip_from  10.0.0.0/8;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # 限流命中统一用 429（nginx 默认是 503），前端只需认一种状态码。
    limit_req_status 429;

    # ============================================================
    # SPA Routing — no caching for index.html
    # ============================================================
    location / {
        include /etc/nginx/security-headers.conf;

        try_files $uri $uri/ /index.html;

        # Never cache the HTML entry point
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ============================================================
    # Static Assets — aggressive caching (hash-based filenames)
    # ============================================================
    # expires 会自己下发一个 Cache-Control: max-age=...，再叠加 add_header 就变成
    # 两个同名响应头，所以这里只用一条 add_header 表达完整语义。
    location ~* \.(js|css)$ {
        include /etc/nginx/security-headers.conf;

        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ============================================================
    # API Proxy → Backend
    # ============================================================
    location /api {
        # 通用兜底 + 登录专用桶。多个 limit_req 会同时生效，任一超限即拒绝。
        limit_req zone=dcn_api burst=100 nodelay;
        limit_req zone=dcn_login burst=10 nodelay;

        proxy_pass http://backend:8002/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings (inspection tasks may take longer)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        # nginx 自己产生的错误（限流 429、连不上后端 502/504）返回 JSON，
        # 而不是默认 HTML 错误页，前端拦截器不必特判。
        # proxy_intercept_errors 保持 off：后端返回的 429/500 原样透传，
        # 由后端的统一错误格式负责。
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @backend_unavailable;
    }

    # nginx 层限流命中 —— 响应体与后端 rate_limit_exceeded_handler 保持一致。
    # recursive_error_pages 默认 off，命名 location 里 return 429 不会再次触发
    # error_page，不存在成环风险。
    location @rate_limited {
        include /etc/nginx/security-headers.conf;

        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"code":"RATE_LIMIT_EXCEEDED","message":"请求过于频繁，请稍后再试","traceId":null}';
    }

    # 后端不可用（重启、迁移中、崩溃）—— 给出明确的 JSON 而不是 nginx 白页。
    location @backend_unavailable {
        include /etc/nginx/security-headers.conf;

        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"success":false,"code":"SERVICE_UNAVAILABLE","message":"后端服务暂时不可用，请稍后再试","traceId":null}';
    }

    # ============================================================
    # WebSocket Proxy — SSH Terminal
    # ============================================================
    location /ws {
        proxy_pass http://backend:8002/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket for terminal sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;

        # 不加 limit_req / limit_conn：终端是长连接，握手只有一次，
        # 按连接数限流会把正常多标签页使用误杀。
    }

    # ============================================================
    # Guacamole WebSocket Proxy — RDP Remote Desktop
    # ============================================================
    location /guacamole {
        proxy_pass http://backend:8002/guacamole;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extra-long timeouts for RDP sessions
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }
}
