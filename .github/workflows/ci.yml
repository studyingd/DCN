name: CI (Lint + Test + Build)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  # 后端覆盖率下限。当前实际约 54%，留出少量缓冲；提升后请同步上调，
  # 让这个数字只涨不跌，防止新代码不带测试把覆盖率拖下去。
  COV_FLOOR: '50'

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Backend Lint — ruff checks Python code quality
  # ═══════════════════════════════════════════════════════════════════
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        working-directory: ./backend
        # 版本以 requirements-dev.txt 为唯一来源，避免 CI 与本地 lint 规则漂移
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Run ruff check
        working-directory: ./backend
        # 用 "." 而不是枚举目录：backend/ 下还有 init_db.py、migrate_rack_24u.py
        # 这类顶层脚本，枚举容易漏。ruff 默认排除 .venv/__pycache__。
        run: ruff check .

      - name: Run ruff format check
        working-directory: ./backend
        run: ruff format --check .

  # ═══════════════════════════════════════════════════════════════════
  # 2. Frontend Lint — ESLint + TypeScript type check
  # ═══════════════════════════════════════════════════════════════════
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx vue-tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Prettier format check
        working-directory: ./frontend
        run: npm run format:check

  # ═══════════════════════════════════════════════════════════════════
  # 2b. Frontend Test — vitest unit tests for pure utils
  # ═══════════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: npm run test:unit

  # ═══════════════════════════════════════════════════════════════════
  # 3. Backend Test — pytest with MySQL service
  # ═══════════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dcn_test_pass
          MYSQL_DATABASE: dcn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Init test database
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:dcn_test_pass@127.0.0.1:3306/dcn_test
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
          CREDENTIAL_SECRET_KEY: ci-test-credential-key-32bytes!!
          ADMIN_PASSWORD: ci-test-admin-password
        run: python -m alembic upgrade head

      - name: Run pytest
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:dcn_test_pass@127.0.0.1:3306/dcn_test
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
          CREDENTIAL_SECRET_KEY: ci-test-credential-key-32bytes!!
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-test-admin-password
        run: |
          python -m pytest tests -v --tb=short -m "not e2e" \
            --cov=app --cov-report=term --cov-fail-under=${{ env.COV_FLOOR }}

  # ═══════════════════════════════════════════════════════════════════
  # 4. Frontend Build — Vite production build
  # ═══════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════
  # 5. Docker Verify — validate compose config + build images (PR only)
  # ═══════════════════════════════════════════════════════════════════
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        env:
          MYSQL_ROOT_PASSWORD: ci-test
          JWT_SECRET: ci-test
          ADMIN_PASSWORD: ci-test
          CREDENTIAL_SECRET_KEY: ci-test
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build Backend image (verify only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: dcn-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image (verify only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: dcn-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
