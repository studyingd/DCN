name: CI (Lint + Test + Build)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Backend Lint — ruff checks Python code quality
  # ═══════════════════════════════════════════════════════════════════
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/

  # ═══════════════════════════════════════════════════════════════════
  # 2. Frontend Lint — ESLint + TypeScript type check
  # ═══════════════════════════════════════════════════════════════════
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx vue-tsc --noEmit

      - name: Run ESLint
        working-directory: ./frontend
        run: npx eslint src
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════
  # 3. Backend Test — pytest with MySQL service
  # ═══════════════════════════════════════════════════════════════════
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dcn_test_pass
          MYSQL_DATABASE: dcn_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Init test database
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:dcn_test_pass@127.0.0.1:3306/dcn_test
        run: |
          python -c "
          import os
          os.environ.setdefault('DATABASE_URL', 'mysql+pymysql://root:dcn_test_pass@127.0.0.1:3306/dcn_test')
          from app.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print('Test database tables created.')
          "

      - name: Run pytest
        working-directory: ./backend
        env:
          DATABASE_URL: mysql+pymysql://root:dcn_test_pass@127.0.0.1:3306/dcn_test
          JWT_SECRET: ci-test-jwt-secret-do-not-use-in-production
          CREDENTIAL_SECRET_KEY: ci-test-credential-key-32bytes!!
          MINIO_ACCESS_KEY: ci-test-minio-access-key
          MINIO_SECRET_KEY: ci-test-minio-secret-key
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-test-admin-password
        run: |
          python -m pytest . -v --tb=short

  # ═══════════════════════════════════════════════════════════════════
  # 4. Frontend Build — Vite production build
  # ═══════════════════════════════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ═══════════════════════════════════════════════════════════════════
  # 5. Docker Verify — validate compose config + build images (PR only)
  # ═══════════════════════════════════════════════════════════════════
  docker-verify:
    name: Docker Verify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        env:
          MYSQL_ROOT_PASSWORD: ci-test
          JWT_SECRET: ci-test
          ADMIN_PASSWORD: ci-test
          CREDENTIAL_SECRET_KEY: ci-test
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build Backend image (verify only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          load: true
          tags: dcn-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image (verify only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: dcn-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
